name: Monitoreo de Caudales SCM

on:
  schedule:
    - cron: '0 */2 * * *' # Se ejecuta cada 2 horas en UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Requerido para hacer git push sin errores 403

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install requests pandas tzdata matplotlib

      - name: Ejecutar extracción de datos
        run: python "caudales_scm.py"

      - name: Generar gráficos y README
        run: python "graficos.py"

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática de caudales y gráficos SCM" && git push)
