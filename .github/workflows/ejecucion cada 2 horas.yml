name: Monitoreo de Caudales SCM

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install requests pandas tzdata matplotlib

      - name: Ejecutar extracción de datos
        env:
          SCM_BEARER_TOKEN: ${{ secrets.SCM_BEARER_TOKEN }}
        run: python "caudales_scm.py"

      - name: Generar gráficos y README
        run: python "graficos_scm.py"

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "No se detectaron cambios en caudales ni gráficos."
          else
            git commit -m "chore(data): actualización automática caudales SCM [skip ci]"
            git push
          fi
